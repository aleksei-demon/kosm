<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Космос Комфорт</title>

    <style>
        :root {
            --bg: #07111d;
            --panel: #10253a;
            --accent: #4ddcff;
            --text: #e5f8ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Segoe UI, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        #starfield {
            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: -1;

        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 16px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
        }

        .card {
            /* background: var(--panel); */
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            gap: 12px;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input,
        select {
            /* width: 100%; */
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: #081726;
            color: white;
        }

        .result {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .info {
            opacity: .8;
        }

        details {
            margin-top: 10px;
        }

        @media(max-width:700px) {

            h1 {
                font-size: 1.5rem;
            }

        }
    </style>
</head>

<body>
    <canvas id="starfield"></canvas>
    <div class="container">

        <h1>🚀 Космос Комфорт</h1>

        <div class="card">

            <div class="grid">

                <div>
                    <label>Откуда</label>
                    <select id="from"></select>
                </div>

                <div>
                    <label>Куда</label>
                    <select id="to"></select>
                </div>

                <div>
                    <label>Лимит скорости (% c)</label>
                    <input id="speedLimit" type="number" min="0" step="0.1" value="20">
                </div>

                <div>
                    <label>Расстояние (ручной ввод)</label>
                    <input id="customDistance" type="number" min="0" step="any">
                </div>

            </div>

            <br>

            <label>
                <input type="checkbox" id="lightYears">
                Использовать световые годы
            </label>

            <div class="info">
                ℹ Используются средние расстояния между орбитами.
            </div>

            <details>

                <summary>Расширенные настройки</summary>

                <br>

                <label>Ускорение (g)</label>

                <input id="gForce" type="number" step="0.1" value="1">

            </details>

        </div>

        <div class="card result" id="result">
            Введите параметры полёта.
        </div>
        <div class="card">

            <h3>График скорости</h3>

            <canvas id="velocityCanvas" width="1000" height="300">
            </canvas>

        </div>

        <div class="card">

            <h3>График расстояния</h3>

            <canvas id="distanceCanvas" width="1000" height="300">
            </canvas>

        </div>
    </div>

    <script>
        "use strict";

        /*
        =================================================
        Константы
        =================================================
        */

        const C = 299792458;
        const G = 9.80665;
        const LIGHT_YEAR_KM = 9.4607e12;
        const AU_KM = 149597870.7;
        let speechTimer = null;

        let madnessTimer = null;

        let madnessMode = false;
        /*
        =================================================
        Вспомогательные функции физики
        =================================================
        */

        function lorentzFactor(beta) {

            if (beta >= 1) {
                beta = 0.999999999;
            }

            return 1 / Math.sqrt(
                1 - beta * beta
            );

        }


        /*
        =================================================
        Объекты
        =================================================
        */

        const CELESTIAL_OBJECTS = {

            "Меркурий": 0.39,
            "Венера": 0.72,
            "Земля": 1,
            "Луна": 1.00257,
            "Марс": 1.524,

            "Юпитер": 5.20,
            "Сатурн": 9.58,
            "Уран": 19.20,
            "Нептун": 30.05,
            "Плутон": 39.48,

            "Проксима Центавра": 276000,
            "Альфа Центавра A": 275900,
            "Альфа Центавра B": 275900,
            "Звезда Барнарда": 380000,
            "Сириус": 550000
        };

        const fromSelect =
            document.getElementById("from");

        const toSelect =
            document.getElementById("to");

        for (const name in CELESTIAL_OBJECTS) {

            fromSelect.add(
                new Option(name, name)
            );

            toSelect.add(
                new Option(name, name)
            );

        }

        toSelect.selectedIndex = 2;

        /*
        =================================================
        Формат времени
        =================================================
        */

        function formatDuration(seconds) {

            seconds = Math.round(seconds);

            const year = Math.floor(seconds / 31557600);
            seconds %= 31557600;

            const day = Math.floor(seconds / 86400);
            seconds %= 86400;

            const hour = Math.floor(seconds / 3600);
            seconds %= 3600;

            const minute = Math.floor(seconds / 60);
            seconds %= 60;

            if (year) {
                return `${year} ${pluralYears(year)} ${day} суток`;
            }

            if (day) {
                return `${day} суток ${hour} часов`;
            }

            if (hour) {
                return `${hour} часов ${minute} минут`;
            }

            if (minute) {
                return `${minute} минут ${seconds} секунд`;
            }

            return `${seconds} секунд`;
        }


        function formatAxisTime(seconds) {

            if (seconds >= 31557600) {

                return (
                    seconds /
                    31557600
                ).toFixed(1)
                    + " г";

            }

            if (seconds >= 86400) {

                return (
                    seconds /
                    86400
                ).toFixed(1)
                    + " сут";

            }

            if (seconds >= 3600) {

                return (
                    seconds /
                    3600
                ).toFixed(1)
                    + " ч";

            }

            if (seconds >= 60) {

                return (
                    seconds /
                    60
                ).toFixed(1)
                    + " мин";

            }

            return Math.round(seconds)
                + " сек";

        }

        function getNiceTimeStep(maxTime) {

            const candidates = [

                1,
                2,
                5,

                10,
                20,
                50,

                60,
                120,
                300,
                600,
                1800,

                3600,
                7200,
                14400,
                21600,

                43200,
                86400,

                172800,
                432000,

                864000,

                2592000,

                31557600,

                2 * 31557600,
                5 * 31557600,

                10 * 31557600,

                20 * 31557600,

                50 * 31557600

            ];

            const targetTicks = 6;

            const desired =
                maxTime /
                targetTicks;

            for (const step of candidates) {

                if (step >= desired) {

                    return step;

                }

            }

            return candidates[
                candidates.length - 1
            ];

        }

        function drawTimeAxis(
            ctx,
            left,
            top,
            graphWidth,
            graphHeight,
            totalTime
        ) {

            const step =
                getNiceTimeStep(
                    totalTime
                );

            const maxAxisTime =
                Math.ceil(
                    totalTime /
                    step
                ) * step;

            const tickCount =
                Math.floor(
                    maxAxisTime /
                    step
                );

            for (
                let i = 0;
                i <= tickCount;
                i++
            ) {

                const time =
                    i * step;

                const x =
                    left +
                    (
                        time /
                        maxAxisTime
                    )
                    *
                    graphWidth;

                ctx.strokeStyle =
                    "rgba(255,255,255,0.12)";

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    top
                );

                ctx.lineTo(
                    x,
                    top + graphHeight
                );

                ctx.stroke();

                ctx.fillStyle =
                    "#cccccc";

                ctx.fillText(
                    formatAxisTime(
                        time
                    ),
                    x - 15,
                    top + graphHeight + 20
                );

            }

            return maxAxisTime;

        }


        function formatDistanceLabel(km) {

            if (km >= 1e12) {

                return (
                    km /
                    9.4607e12
                ).toFixed(2)
                    + " св.г.";

            }

            if (km >= 1e9) {

                return (
                    km / 1e9
                ).toFixed(1)
                    + " млрд км";

            }

            if (km >= 1e6) {

                return (
                    km / 1e6
                ).toFixed(1)
                    + " млн км";

            }

            return Math.round(km)
                + " км";

        }


        function pluralYears(value) {

            const n = Math.abs(value) % 100;
            const n1 = n % 10;

            if (n > 10 && n < 20) {
                return "лет";
            }

            if (n1 > 1 && n1 < 5) {
                return "года";
            }

            if (n1 === 1) {
                return "год";
            }

            return "лет";
        }

        /*
        =================================================
        Расстояние
        =================================================
        */

        function getDistanceKm() {

            const custom =
                Number(
                    document
                        .getElementById("customDistance")
                        .value
                );

            if (custom > 0) {

                if (
                    document
                        .getElementById("lightYears")
                        .checked
                ) {
                    return custom * LIGHT_YEAR_KM;
                }

                return custom;
            }

            const from =
                CELESTIAL_OBJECTS[
                fromSelect.value
                ];

            const to =
                CELESTIAL_OBJECTS[
                toSelect.value
                ];

            return Math.abs(from - to) * AU_KM;
        }

        /*
        =================================================
        Релятивистический расчёт
        =================================================
        */
        /*
        =================================================
        Релятивистический полёт
        =================================================
        */
        function calculateRelativisticFlight(
            distanceKm,
            speedPercent
        ) {

            const distance =
                distanceKm * 1000;

            const acceleration =
                Number(
                    document
                        .getElementById("gForce")
                        .value
                ) * G;

            const speedLimit =
                (speedPercent / 100) * C;

            /*
            ============================================
            Вспомогательные функции
            ============================================
            */

            const atanh = x =>
                0.5 *
                Math.log(
                    (1 + x) /
                    (1 - x)
                );

            const acosh = x =>
                Math.log(
                    x +
                    Math.sqrt(
                        x * x - 1
                    )
                );

            /*
            ============================================
            Разгон до заданной скорости
            при постоянном собственном ускорении
            ============================================
            */

            const betaLimit =
                Math.min(
                    speedLimit / C,
                    0.999999999
                );

            const rapidity =
                atanh(betaLimit);

            /*
            Собственное время экипажа
            */

            const accelShipTime =
                (C / acceleration) *
                rapidity;

            /*
            Время внешнего наблюдателя
            */

            const accelObserverTime =
                (C / acceleration) *
                Math.sinh(rapidity);

            /*
            Пройденное расстояние
            за разгон
            */

            const accelDistance =
                (C * C / acceleration) *
                (
                    Math.cosh(rapidity) - 1
                );

            /*
            ============================================
            Проверяем достижимость лимита
            ============================================
            */

            let observerTime;
            let shipTime;
            let maxSpeed;
            let mode;

            if (
                accelDistance * 2 >=
                distance
            ) {

                /*
                ========================================
                Лимит скорости НЕ достигнут
                ========================================
                */

                const halfDistance =
                    distance / 2;

                const eta =
                    acosh(
                        1 +
                        (
                            acceleration *
                            halfDistance
                        ) /
                        (
                            C * C
                        )
                    );

                const halfShipTime =
                    (C / acceleration) *
                    eta;

                const halfObserverTime =
                    (C / acceleration) *
                    Math.sinh(eta);

                observerTime =
                    2 *
                    halfObserverTime;

                shipTime =
                    2 *
                    halfShipTime;

                maxSpeed =
                    C *
                    Math.tanh(eta);

                mode =
                    "Разгон → Торможение";

            }
            else {

                /*
                ========================================
                Разгон → Насыщение → Торможение
                ========================================
                */

                const cruiseDistance =
                    distance -
                    accelDistance * 2;

                const cruiseObserverTime =
                    cruiseDistance /
                    speedLimit;

                const gamma =
                    Math.cosh(
                        rapidity
                    );

                const cruiseShipTime =
                    cruiseObserverTime /
                    gamma;

                observerTime =
                    accelObserverTime * 2 +
                    cruiseObserverTime;

                shipTime =
                    accelShipTime * 2 +
                    cruiseShipTime;

                maxSpeed =
                    speedLimit;

                mode =
                    "Разгон → Насыщение → Торможение";

            }

            const gammaMax =
                1 /
                Math.sqrt(
                    1 -
                    Math.pow(
                        maxSpeed / C,
                        2
                    )
                );

            return {

                observerTime,

                shipTime,

                maxSpeedPercent:
                    (maxSpeed / C) * 100,

                gamma:
                    gammaMax,

                mode,

                distance,

                speedLimit,

                acceleration

            };

        }

        /*
        =================================================
        Волшебный режим
        =================================================
        */
        function calculateMagicFlight(
            distanceKm,
            speedPercent
        ) {

            const distance =
                distanceKm * 1000;

            const velocity =
                (speedPercent / 100)
                *
                C;

            const time =
                distance /
                velocity;

            return {

                observerTime:
                    time,

                shipTime:
                    time,

                maxSpeedPercent:
                    speedPercent,

                mode:
                    "Волшебный режим",

                distance,

                speedLimit:
                    velocity

            };

        }
        function buildFlightProfile(flight) {

            const points = [];

            const totalTime =
                flight.observerTime;

            const maxSpeed =
                flight.maxSpeedPercent;

            const count = 120;

            for (let i = 0; i <= count; i++) {

                const p = i / count;

                let speed;

                if (
                    flight.mode.includes(
                        "Насыщение"
                    )
                ) {

                    if (p < 0.25) {

                        speed =
                            maxSpeed *
                            (p / 0.25);

                    }
                    else if (p < 0.75) {

                        speed =
                            maxSpeed;

                    }
                    else {

                        speed =
                            maxSpeed *
                            (
                                (1 - p)
                                /
                                0.25
                            );

                    }

                }
                else {

                    if (p < 0.5) {

                        speed =
                            maxSpeed *
                            (p / 0.5);

                    }
                    else {

                        speed =
                            maxSpeed *
                            (
                                (1 - p)
                                /
                                0.5
                            );

                    }

                }

                points.push({

                    time:
                        totalTime * p,

                    speed

                });

            }

            return points;

        }

        function buildDistanceProfile(flight) {

            const points = [];

            const totalDistance =
                flight.distance / 1000;

            const count = 200;

            for (let i = 0; i <= count; i++) {

                const p = i / count;

                let distance;

                if (
                    flight.mode.includes(
                        "Насыщение"
                    )
                ) {

                    if (p < 0.25) {

                        distance =
                            totalDistance *
                            (
                                2 * p * p
                            );

                    }
                    else if (p < 0.75) {

                        distance =
                            totalDistance *
                            (
                                0.125 +
                                (p - 0.25) *
                                1.5
                            );

                    }
                    else {

                        const q =
                            (p - 0.75) / 0.25;

                        distance =
                            totalDistance *
                            (
                                0.875 +
                                0.125 *
                                (
                                    2 * q - q * q
                                )
                            );

                    }

                } else {

                    if (p < 0.5) {

                        distance =
                            totalDistance *
                            (
                                2 * p * p
                            );

                    } else {

                        const q =
                            (p - 0.5) / 0.5;

                        distance =
                            totalDistance *
                            (
                                0.5 +
                                (
                                    q -
                                    q * q / 2
                                )
                            );

                    }

                }

                points.push({

                    time:
                        flight.observerTime * p,

                    distance

                });

            }

            return points;

        }


        /*
        =================================================
        Canvas графики
        =================================================
        */


        function drawVelocityGraph(flight) {

            const canvas =
                document.getElementById(
                    "velocityCanvas"
                );

            if (!canvas) {
                return;
            }

            const ctx =
                canvas.getContext("2d");

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const profile =
                buildFlightProfile(
                    flight
                );

            if (!profile.length) {
                return;
            }

            const w = canvas.width;
            const h = canvas.height;

            const left = 80;
            const right = 30;
            const top = 30;
            const bottom = 50;

            const graphWidth =
                w - left - right;

            const graphHeight =
                h - top - bottom;

            ctx.font = "14px Arial";

            /*
            ============================================
            Максимальная скорость графика
            ============================================
            */

            const maxSpeed =
                Math.max(
                    ...profile.map(
                        p => p.speed
                    )
                );

            /*
            ============================================
            Оси
            ============================================
            */

            ctx.strokeStyle = "#888";
            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(left, top);
            ctx.lineTo(left, h - bottom);

            ctx.lineTo(
                w - right,
                h - bottom
            );

            ctx.stroke();

            /*
            ============================================
            Подписи осей
            ============================================
            */

            ctx.fillStyle = "#ffffff";

            ctx.fillText(
                "Скорость (% c)",
                10,
                20
            );

            ctx.fillText(
                "Время",
                w - 60,
                h - 10
            );
            /*
            ============================================
            Шкала времени X
            ============================================
            */

            const axisTime =
                drawTimeAxis(
                    ctx,
                    left,
                    top,
                    graphWidth,
                    graphHeight,
                    flight.observerTime
                );

            /*
            ============================================
            Логарифмическая шкала Y
            ============================================
            */

            const ticks = 5;

            for (let i = 0; i <= ticks; i++) {

                const ratio =
                    i / ticks;

                const value =
                    maxSpeed *
                    Math.pow(
                        ratio,
                        2
                    );

                const y =
                    h - bottom -
                    ratio *
                    graphHeight;

                ctx.strokeStyle =
                    "rgba(255,255,255,0.15)";

                ctx.beginPath();

                ctx.moveTo(left, y);

                ctx.lineTo(
                    w - right,
                    y
                );

                ctx.stroke();

                ctx.fillStyle =
                    "#cccccc";

                ctx.fillText(
                    value.toFixed(2),
                    10,
                    y + 5
                );

            }



            ctx.fillStyle = "#00FFFF";

            ctx.fillText(
                `Макс: ${maxSpeed.toFixed(2)}% c`,
                w - 180,
                20
            );


            /*
            ============================================
            График скорости
            ============================================
            */

            ctx.strokeStyle =
                "#00FFFF";

            ctx.lineWidth = 3;

            ctx.beginPath();

            profile.forEach((p, index) => {

                const x =
                    left +
                    (
                        p.time /
                        axisTime
                    )
                    *
                    graphWidth;

                const y =
                    h - bottom -
                    (
                        Math.log10(
                            p.speed + 1
                        )
                        /
                        Math.log10(
                            maxSpeed + 1
                        )
                    )
                    *
                    graphHeight;

                if (index === 0) {

                    ctx.moveTo(x, y);

                } else {

                    ctx.lineTo(x, y);

                }

            });

            ctx.stroke();

            /*
            ============================================
            Подпись максимальной скорости
            ============================================
            */

            ctx.fillStyle =
                "#00FFFF";

            ctx.fillText(
                `Макс: ${maxSpeed.toFixed(2)}% c`,
                w - 180,
                20
            );

        }




        function drawDistanceGraph(flight) {

            const canvas =
                document.getElementById(
                    "distanceCanvas"
                );

            if (!canvas) {
                return;
            }

            const ctx =
                canvas.getContext("2d");

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const profile =
                buildDistanceProfile(
                    flight
                );

            const w =
                canvas.width;

            const h =
                canvas.height;

            const left = 80;
            const right = 30;
            const top = 30;
            const bottom = 50;

            const graphWidth =
                w - left - right;

            const graphHeight =
                h - top - bottom;

            ctx.font =
                "14px Arial";

            const maxDistance =
                Math.max(
                    ...profile.map(
                        p => p.distance
                    )
                );

            /*
            ==========================
            Оси
            ==========================
            */

            ctx.strokeStyle = "#888";

            ctx.beginPath();

            ctx.moveTo(left, top);

            ctx.lineTo(
                left,
                h - bottom
            );

            ctx.lineTo(
                w - right,
                h - bottom
            );

            ctx.stroke();

            /*
            ==========================
            Подписи
            ==========================
            */

            ctx.fillStyle = "#fff";

            ctx.fillText(
                "Расстояние (км)",
                10,
                20
            );

            ctx.fillText(
                "Время",
                w - 60,
                h - 10
            );

            /*
            ============================================
            Шкала времени X
            ============================================
            */

            const axisTime =
                drawTimeAxis(
                    ctx,
                    left,
                    top,
                    graphWidth,
                    graphHeight,
                    flight.observerTime
                );
            /*
            ==========================
            Сетка
            ==========================
            */

            for (let i = 0; i <= 5; i++) {

                const y =
                    h - bottom -
                    i / 5 * graphHeight;

                ctx.strokeStyle =
                    "rgba(255,255,255,0.15)";

                ctx.beginPath();

                ctx.moveTo(left, y);

                ctx.lineTo(
                    w - right,
                    y
                );

                ctx.stroke();

                const value =
                    maxDistance *
                    i / 5;

                ctx.fillStyle = "#ccc";

                ctx.fillText(
                    formatDistanceLabel(
                        value
                    ),
                    10,
                    y + 5
                );

            }

            /*
            ==========================
            Кривая
            ==========================
            */

            ctx.strokeStyle =
                "#00FF88";

            ctx.lineWidth = 3;

            ctx.beginPath();

            profile.forEach((p, index) => {

                const x =
                    left +
                    (
                        p.time /
                        axisTime
                    ) *
                    graphWidth;

                const y =
                    h - bottom -
                    (
                        p.distance /
                        maxDistance
                    ) *
                    graphHeight;

                if (index === 0) {

                    ctx.moveTo(x, y);

                } else {

                    ctx.lineTo(x, y);

                }

            });

            ctx.stroke();

            /*
            ==========================
            Точки событий
            ==========================
            */

            const markers =
                flight.mode.includes(
                    "Насыщение"
                )
                    ?
                    [0.25, 0.75, 1]
                    :
                    [0.5, 1];

            const names =
                flight.mode.includes(
                    "Насыщение"
                )
                    ?
                    [
                        "Конец разгона",
                        "Начало торможения",
                        "Прибытие"
                    ]
                    :
                    [
                        "Пик скорости",
                        "Прибытие"
                    ];

            markers.forEach(
                (m, index) => {

                    const x =
                        left +
                        m * graphWidth;

                    ctx.fillStyle =
                        "#FFD700";

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        h - bottom - 5,
                        4,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                    ctx.fillText(
                        names[index],
                        x - 20,
                        h - bottom + 20
                    );

                }
            );

        }


        /*
        =================================================
        Озвучка
        =================================================
        */

        function speakResult(text) {

            if (!("speechSynthesis" in window)) {
                return;
            }

            speechSynthesis.cancel();

            const utter =
                new SpeechSynthesisUtterance(
                    text
                );

            utter.lang = "ru-RU";

            speechSynthesis.speak(
                utter
            );

        }

        /*
        =================================================
        Безумный режим
        =================================================
        */

        function triggerMadnessMode() {

            madnessMode = true;

            clearTimeout(
                madnessTimer
            );

            madnessTimer =
                setTimeout(() => {

                    madnessMode = false;

                    document
                        .getElementById(
                            "speedLimit"
                        )
                        .value = 10;

                    updateResult();

                }, 30000);

        }

        /*
        =================================================
        Starfield
        =================================================
        */

        const stars = [];

        function createStar() {

            return {

                x:
                    (Math.random() - 0.5) * 2,

                y:
                    (Math.random() - 0.5) * 2,

                z:
                    Math.random() * 0.9 + 0.1

            };

        }

        function initStars() {

            for (
                let i = 0;
                i < 700;
                i++
            ) {

                stars.push(
                    createStar()
                );

            }

        }

        function drawStarfield() {

            const canvas =
                document.getElementById(
                    "starfield"
                );

            const ctx =
                canvas.getContext("2d");

            canvas.width =
                innerWidth;

            canvas.height =
                innerHeight;

            const cx =
                canvas.width / 2;

            const cy =
                canvas.height / 2;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            let speedFactor =
                Number(
                    document
                        .getElementById(
                            "speedLimit"
                        ).value || 10
                ) / 10;

            if (madnessMode) {

                speedFactor *= 10;

            }

            for (const star of stars) {

                star.x *=
                    1 +
                    0.008 *
                    star.z *
                    speedFactor;

                star.y *=
                    1 +
                    0.008 *
                    star.z *
                    speedFactor;

                const px =
                    cx +
                    star.x * cx;

                const py =
                    cy +
                    star.y * cy;

                if (
                    px < 0 ||
                    px > canvas.width ||
                    py < 0 ||
                    py > canvas.height
                ) {

                    Object.assign(
                        star,
                        createStar()
                    );

                    continue;
                }

                if (madnessMode) {

                    ctx.fillStyle =
                        `hsl(${Math.random() * 360
                        },100%,60%)`;

                }
                else {

                    ctx.fillStyle =
                        "#ccffff";

                }

                const size =
                    1 +
                    star.z * 4;

                ctx.fillRect(
                    px,
                    py,
                    size,
                    size
                );

            }

            requestAnimationFrame(
                drawStarfield
            );

        }

        /*
        =================================================
        Обновление результата
        =================================================
        */

        function updateResult() {

            const result =
                document.getElementById(
                    "result"
                );

            if (
                !document
                    .getElementById(
                        "customDistance"
                    ).value
                &&
                fromSelect.value ===
                toSelect.value
            ) {
                result.innerHTML =
                    "Пункт отправления и назначения совпадают.";
                document.getElementById(
                    "velocityCanvas"
                ).style.display = "none";

                document.getElementById(
                    "distanceCanvas"
                ).style.display = "none";
                return;
            }

            const distanceKm =
                getDistanceKm();

            const speed =
                Number(
                    document
                        .getElementById(
                            "speedLimit"
                        ).value
                );
            if (speed > 100) {

                if (!madnessMode) {

                    speakResult(
                        "А-а! Космос поломал, мелкий засранц!!!"
                    );

                }

                triggerMadnessMode();

            }
            let data;

            if (speed <= 100) {

                data =
                    calculateRelativisticFlight(
                        distanceKm,
                        speed
                    );

            } else {

                data =
                    calculateMagicFlight(
                        distanceKm,
                        speed
                    );

            }

            const saving =
                data.observerTime
                -
                data.shipTime;

            const percent =
                (
                    saving /
                    data.observerTime
                ) * 100;

            result.innerHTML = `

<b>Расстояние:</b>
${distanceKm.toLocaleString("ru-RU")} км
<br>

<b>Лимит скорости:</b>
${speed}% c
<br>

<b>Максимальная достигнутая скорость:</b>
${data.maxSpeedPercent.toFixed(2)}% c
<br>

<b>Время наблюдателя:</b>
${formatDuration(data.observerTime)}
<br>

<b>Время на корабле:</b>
${formatDuration(data.shipTime)}
<br>

<b>Экономия времени:</b>
${formatDuration(
                Math.max(
                    0,
                    saving
                )
            )}
<br>

<b>Экономия (%):</b>
${percent.toFixed(2)}%
<br>

<b>Режим:</b>
${data.mode}

`;
            document.getElementById(
                "velocityCanvas"
            ).style.display = "block";

            document.getElementById(
                "distanceCanvas"
            ).style.display = "block";
            drawVelocityGraph(
                data
            );

            drawDistanceGraph(
                data
            );

            clearTimeout(
                speechTimer
            );

            speechTimer =
                setTimeout(() => {

                    if (speed > 100) {
                        return;
                    }

                    const text =
                        `Полёт ${fromSelect.value} — ${toSelect.value}
        займёт
        ${formatDuration(
                            data.shipTime
                        )}
        времени на корабле.
        На Земле пройдёт
        ${formatDuration(
                            data.observerTime
                        )}`;

                    speakResult(text);

                }, 2000);
        }

        document.addEventListener(
            "input",
            updateResult
        );

        updateResult();
        initStars();
        drawStarfield();
    </script>

</body>

</html>
